# =============================================================================
# NAS System - Docker Compose
# 开发和生产环境配置
# =============================================================================

services:
  # NAS System 主服务
  nas-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nas-system
    ports:
      - "6050:6050"
    volumes:
      # 数据持久化
      - nas-data:/app/data
      # 存储目录 - 可挂载宿主机目录
      - nas-storage:/app/storage
      # 日志
      - nas-logs:/app/logs
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/nas.db
      - NasSystem__StoragePath=/app/storage
      # ServerGC 堆数上限。容器未设 CPU limit 时运行时可视线宿主全部逻辑核
      # （开发机 32），默认每核建一个 GC 堆，小负载服务白背每堆的固定开销。
      # NAS 负载（IO 为主 + 偶发缩略图编解码）用不到 32 堆，固定为 8
      - DOTNET_GCHeapCount=8
      # 键名必须与 JwtSettings 的属性一一对应：Jwt__Secret 会映射到 Jwt:Secret，
      # 而代码读的是 Jwt:SecretKey，键名写错的后果是 Production 下启动即抛
      # InvalidOperationException（AuthenticationExtensions 的 fail-fast），容器反复重启
      # 不设默认值：曾经的 ${JWT_SECRET:-your-super-secret-key-...} 形式会让未设变量的
      # 部署带着一个公开字面量密钥启动，fail-fast 被静默绕过——任何人都能伪造
      # 任意用户（含 SuperAdmin）令牌。缺失即空值，由应用启动期 fail-fast 报错
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=NasSystem
      - Jwt__Audience=NasSystemUsers
      - Jwt__AccessTokenExpirationMinutes=60
      # 反代真实客户端 IP（审计 F-072）。nginx 之后 Kestrel 看到的对端是
      # nginx 容器，WebDAV 失败锁定与分享限流都会退化成"全体共享一个桶"：
      # 一个攻击者的失败轰炸把同反代下所有正常用户一起锁掉。
      # 填 nginx 容器 IP（或整个 docker 网桥段）后应用才采纳 X-Forwarded-For。
      # 默认不填 = 不信任客户端自报头：6050 端口对外发布，无条件信任等于
      # 允许伪造客户端键绕过失败锁定，比共享桶更糟。
      # 给 nginx 配固定 IP 的做法（推荐，IP 稳定）：
      #   networks: { nas-network: { ipv4_address: 172.20.0.10 } }
      # 然后这里填 172.20.0.10；或填网段 NasSystem__ForwardedHeaders__KnownNetworks=172.20.0.0/16
      # - NasSystem__ForwardedHeaders__KnownProxies=${NAS_FORWARDED_PROXY_IP:-}
      # 分享码枚举的全局速率闸阈值（次/分钟，缺省 600）。合法场景一个链接
      # 被几十人同时点开远到不了；若实测正常使用会触碰 429 就调大
      # - NasSystem__RateLimiting__ShareGlobalPerMinute=600
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nas-network

  # 可选: Nginx 反向代理 (生产环境)
  nginx:
    image: nginx:alpine
    container_name: nas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # certs 改为可写：缺证书时 entrypoint 要能生成自签证书兜底，
      # 原先 ro 挂载会让生成失败、nginx 仍起不来
      - ./certs:/etc/nginx/certs
      # ACME 挑战目录：nginx.conf 把 /.well-known/acme-challenge/ 的 root 指向
      # /var/www/certbot，原先没有这个卷映射，certbot 写进去的文件 nginx 看不到，
      # HTTP-01 验证永远失败
      - ./certbot-webroot:/var/www/certbot
      - ./docker/nginx-entrypoint.sh:/docker-entrypoint.d/40-nas-certs.sh:ro
    depends_on:
      - nas-system
    restart: unless-stopped
    networks:
      - nas-network
    profiles:
      - production

  # 可选: SMB 网络磁盘直通（ROADMAP Phase 0 协议层）
  # 默认不随 compose up 启动，需显式带 profile：
  #   docker compose --profile smb up -d
  # 直通模式：旁路应用层的配额检查、软删除与 SignalR 推送，
  # 面向"把 NAS 当网络磁盘直接用"的管理员场景，边界见 docs/PROTOCOL_ACCESS.md
  nas-smb:
    build:
      context: ./docker/smb
      dockerfile: Dockerfile
    container_name: nas-smb
    ports:
      - "445:445"
    volumes:
      # 与主应用共享同一存储卷：SMB 落盘的文件网页端立即可见
      - nas-storage:/app/storage
    environment:
      # SMB 账号独立于应用账号体系（samba 自有 passdb，与应用 SQLite 不通）。
      # 用户名固定 nasadmin（smb.conf 的 valid users）。缺省空值由 entrypoint
      # fail-fast 拒绝启动（F-096：不得用写进仓库的弱口令暴露共享卷）；
      # 不能用 ${VAR:?} 形式，那会让未设变量的宿主在解析整个 compose 文件时
      # 就失败，连带拖垮不带 smb profile 的默认启动
      - NAS_SMB_PASSWORD=${NAS_SMB_PASSWORD:-}
    restart: unless-stopped
    networks:
      - nas-network
    profiles:
      - smb

# 命名卷
volumes:
  nas-data:
    driver: local
  nas-storage:
    driver: local
  nas-logs:
    driver: local

# 网络
networks:
  nas-network:
    driver: bridge
