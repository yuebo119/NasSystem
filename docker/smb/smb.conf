# =============================================================================
# NAS System - docker/smb/smb.conf
# SMB sidecar 配置。挂载到 /etc/samba/smb.conf
# =============================================================================
# 单共享 "nas" 直通 /app/storage：管理员把 NAS 当网络磁盘直接用的通道。
# 该通道旁路应用层治理（配额、软删除、SignalR），边界见 ROADMAP §2。

[global]
    workgroup = WORKGROUP
    server string = NAS System
    netbios name = NASSYSTEM

    # 仅本地账号认证，禁访客：无密码的 SMB 共享等于公网裸奔
    security = user
    map to guest = never
    guest ok = no

    # 只监听容器网络接口。不显式绑定时 smbd 会尝试枚举全部网卡，
    # 容器里多余接口的日志噪音会掩盖真实问题
    interfaces = lo eth0
    bind interfaces only = yes

    # 关闭打印共享：NAS 场景不需要，少了 CUPS 依赖与一类无用端口
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # 日志落文件而非 stdout：compose logs 只关心 smbd 的启停行，
    # 逐连接的噪音会把它冲掉
    log file = /var/log/samba/log.%m
    log level = 1
    max log size = 50

[nas]
    comment = NAS System 共享存储
    path = /app/storage
    valid users = nasadmin
    force user = nasuser
    force group = nasuser
    read only = no
    browseable = yes
    # 跟随主应用默认文件的属主语义：文件 664 目录 775，
    # 与 chown -R nasuser:nasuser /app 的部署约定一致
    create mask = 0664
    directory mask = 0775
