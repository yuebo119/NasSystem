# =============================================================================
# NAS System - Nginx 配置 (生产环境)
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 不回显 nginx 版本号（F-097）
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/atom+xml image/svg+xml
               font/woff font/woff2 application/wasm;

    # 静态资源代理缓存：nginx 与 nas-system 是两个容器，nginx 没有 wwwroot 的卷访问权，
    # 因而用 proxy_cache 把后端的静态响应缓存到 nginx 本地盘，第二次起不再进 Kestrel。
    # keys_zone 10m 约可存 8 万条键，max_size 1g 对 SPA 产物绰绰有余。
    # use_temp_path=off：直接写缓存文件，少一次 rename
    proxy_cache_path /var/cache/nginx/nas-static
                      levels=1:2
                      keys_zone=nas_static:10m
                      max_size=1g
                      inactive=30d
                      use_temp_path=off;

    # 上传大小限制：与 Kestrel 的 MaxRequestBodySize（500MB，UploadLimit 常量）
# 对齐。原先 10G 会让 nginx 先把超限请求全量缓冲到盘上，再由 Kestrel 拒绝，
# 白付一份磁盘与时间（F-097）
    client_max_body_size 512m;
    client_body_buffer_size 128k;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 上游服务器
    upstream nas_backend {
        server nas-system:6050;
        keepalive 32;
    }

    # HTTP 服务器 (重定向到 HTTPS)
    server {
        listen 80;
        server_name _;

        # Let's Encrypt 验证
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 服务器
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # SSL 配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS：强制后续访问走 HTTPS（F-097）。证书轮换/自签切换时如需回退，
        # 先在浏览器端清理该域名，或部署阶段暂不启用
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 视频 HLS：首请求同步等待 ffmpeg 转码，长视频可远超全局 600s。
        # 超时会让 nginx 断流、应用侧杀掉 ffmpeg（第 3 轮 F-086）并使重试从零开始，
        # 结果是长视频永远播不了（F-097）。单独放宽该前缀的读写超时
        location /api/v1/media/stream/ {
            proxy_pass http://nas_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API 代理
        location /api/ {
            proxy_pass http://nas_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            # 上传是流式 multipart（应用侧已改 MultipartReader 单趟写盘），
            # nginx 默认全量缓冲会把 500MB 先落盘再转发，双倍 IO 与延迟（F-097）
            proxy_request_buffering off;
        }

        # SignalR WebSocket
        location /hubs/ {
            proxy_pass http://nas_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # 静态资源：Vite 产物是内容哈希文件名（/assets/xxx-HASH.js），
        # 文件名变则内容必变，可无限期强缓存。这是首屏加载的最大单项：
        # 此前所有静态请求都穿过 Kestrel 的 StaticFileMiddleware。
        # 前缀 location 比 / 长，故 /assets/ 的规则先生效
        location /assets/ {
            proxy_pass http://nas_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache nas_static;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_uri";
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            # 上游 Kestrel 已发同一策略（直连部署也生效）；隐藏后由边缘单点定义，
            # 否则 add_header 会追加出两条内容相同的 Cache-Control
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # 入口与 SPA 路由：返回 index.html，绝不能长缓存，
        # 否则发版后浏览器拿旧 HTML 引用旧哈希资源，用户看到旧版界面
        location / {
            proxy_pass http://nas_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache";
        }
    }
}
